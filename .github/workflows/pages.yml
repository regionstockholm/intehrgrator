# Deploy the static Web Shell to GitHub Pages.
#
# Prerequisites (repo admin, one-time):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Until that is configured, this workflow is manual-only so pushes to main
# do not fail CI. After Pages is enabled, uncomment the `push` trigger below.

name: Deploy GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task vendor
      - run: deno task build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
