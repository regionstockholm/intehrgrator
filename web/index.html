<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>intEHRgrator — Integration Workbench</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <strong class="brand">intEHRgrator</strong>
    <span class="toolbar-spacer"></span>
    <button id="btn-copy-ai" type="button">Copy AI Prompt</button>
    <button id="btn-import-ai" type="button">Import Suggestions</button>
    <button id="btn-save-project" type="button">Save Project</button>
    <button id="btn-export-project" type="button">Export Project</button>
    <button id="btn-import-project" type="button">Import Project</button>
  </header>

  <main
    class="panes"
    data-split="row"
    data-split-storage="layout-main-panes"
    data-split-sizes="1,1.4,1"
  >
    <section class="pane source-pane">
      <h2>Source</h2>
      <div
        class="pane-body"
        data-split="column"
        data-split-storage="layout-source-sections"
        data-split-sizes="1.2,1"
      >
        <div class="pane-section">
          <div class="section-header">
            <h3>Schema</h3>
            <button id="btn-load-schema" class="pane-btn" type="button">Load Schema</button>
          </div>
          <div id="schema-tree" class="tree-pane"></div>
        </div>
        <div class="pane-section">
          <div class="section-header">
            <h3>Examples</h3>
            <button id="btn-add-example" class="pane-btn" type="button">+ Add Example</button>
          </div>
          <div id="example-tabs" class="example-tabs"></div>
          <div id="example-tree" class="tree-pane"></div>
        </div>
      </div>
    </section>

    <section class="pane mapping-pane">
      <div class="pane-header">
        <h2>Mapping Editor</h2>
        <button id="btn-open-template" class="pane-btn pane-btn-on-dark" type="button">Open Template</button>
      </div>
      <div
        class="pane-body"
        data-split="column"
        data-split-storage="layout-mapping-sections"
        data-split-sizes="1.2,1"
      >
        <div
          class="mapping-top"
          data-split="row"
          data-split-storage="layout-mapping-top"
          data-split-sizes="1,0.22"
          data-split-min="160"
        >
          <div id="blockly-mount" class="blockly-mount"></div>
          <aside class="slot-rail">
            <h3>Target value slots</h3>
            <div id="skeleton-slots"></div>
          </aside>
        </div>
        <div class="mapping-bottom">
          <h3>Mapping Specification</h3>
          <div id="spec-editor" class="editor-host"></div>
        </div>
      </div>
    </section>

    <section class="pane output-pane">
      <div class="pane-header">
        <h2>Output Preview</h2>
        <button id="btn-export-ts" class="pane-btn pane-btn-on-dark" type="button">Export TS</button>
      </div>
      <div
        class="pane-body"
        data-split="column"
        data-split-storage="layout-output-sections"
      >
        <div class="pane-section">
          <h3>Generated Export</h3>
          <div id="export-editor" class="editor-host"></div>
        </div>
        <div class="pane-section">
          <div class="section-header">
            <h3>Test Run</h3>
            <div class="pane-btn-group">
              <button id="btn-run-test" class="pane-btn" type="button">Run Test</button>
              <button id="btn-autoplay" class="pane-btn" type="button" disabled>▶ Autoplay</button>
            </div>
          </div>
          <div id="test-output" class="editor-host"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="status-bar" class="status-bar">
    <span id="status-main">Ready</span>
    <span id="status-build" class="status-build"></span>
  </footer>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
