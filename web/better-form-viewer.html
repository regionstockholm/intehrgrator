<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>intEHRgrator — Better Form Viewer (optional)</title>
  <link rel="stylesheet" href="vendor/better/styles.css" />
  <link rel="stylesheet" href="vendor/better/styles-theme.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #banner {
      padding: 8px 12px; background: #003B49; color: #fff; font-size: 13px;
    }
    #banner.warn { background: #854d0e; }
    #host { min-height: calc(100vh - 36px); }
    pre { margin: 12px; white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <div id="banner">Better Form Viewer — waiting for licensed renderer assets…</div>
  <div id="host"></div>
  <script type="module">
    const MSG = {
      PUSH: "intehrgrator:better-form-push",
      PULL_REQUEST: "intehrgrator:better-form-pull-request",
      COMPOSITION: "intehrgrator:better-form-composition",
      READY: "intehrgrator:better-form-ready",
    };

    const banner = document.getElementById("banner");
    const host = document.getElementById("host");
    let lastComposition = null;

    async function boot() {
      try {
        await import("./vendor/better/form-renderer.js");
        banner.textContent = "Better Form Viewer ready — Push from intEHRgrator Test Run.";
        banner.classList.remove("warn");
        globalThis.opener?.postMessage?.({ type: MSG.READY }, "*");
      } catch {
        banner.textContent =
          "Renderer missing. Run: deno task setup:better-forms  then rebuild.";
        banner.classList.add("warn");
        host.innerHTML =
          "<pre>Licensed Better Form Renderer assets are optional and git-ignored.\n" +
          "Install from a local Kintegrate checkout:\n\n" +
          "  deno task setup:better-forms\n" +
          "  deno task build\n</pre>";
      }
    }

    globalThis.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || typeof data !== "object") return;
      if (data.type === MSG.PUSH) {
        lastComposition = data.composition;
        host.innerHTML = "<pre>" + JSON.stringify(lastComposition, null, 2) + "</pre>";
        banner.textContent = "Received composition push from intEHRgrator.";
      }
      if (data.type === MSG.PULL_REQUEST) {
        event.source?.postMessage?.(
          { type: MSG.COMPOSITION, composition: lastComposition },
          "*",
        );
      }
    });

    void boot();
  </script>
</body>
</html>
