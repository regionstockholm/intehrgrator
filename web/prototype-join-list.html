<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>join_list Blockly prototypes — intEHRgrator #85</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Google+Sans:400,500" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --proto-bar: #0b1f1c;
      --proto-accent: #005c53;
    }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Google Sans", "Segoe UI", sans-serif;
      background: #f6f7f8;
    }
    body.proto-page {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: 100%;
    }
    .proto-header {
      background: var(--proto-accent);
      color: #fff;
      padding: 10px 20px;
      display: flex;
      gap: 16px;
      align-items: baseline;
    }
    .proto-header strong { font-size: 16px; }
    .proto-header span { opacity: 0.9; font-size: 13px; }
    .proto-banner {
      background: #fff8e1;
      border-bottom: 1px solid #ffe082;
      padding: 8px 20px;
      font-size: 13px;
    }
    .proto-main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      min-height: 0;
    }
    .proto-side {
      overflow: auto;
      padding: 16px 18px 80px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
    }
    .proto-side h2 { margin: 0 0 8px; font-size: 18px; }
    .proto-side h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: #5f6368; }
    .proto-side p, .proto-side li { font-size: 13.5px; line-height: 1.45; color: #202124; }
    .proto-side code { font-size: 12px; background: #f1f3f4; padding: 1px 4px; border-radius: 3px; }
    .proto-out {
      background: #e8f5e9;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
      font-weight: 500;
    }
    .proto-serial {
      background: #f1f3f4;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .proto-canvas-wrap {
      display: grid;
      grid-template-rows: 1fr;
      min-height: 0;
      background: #fff;
    }
    #blockly {
      min-height: 0;
      height: 100%;
    }
    .proto-side table.proto-dt {
      border-collapse: collapse;
      font-size: 12.5px;
      width: 100%;
    }
    .proto-side table.proto-dt th, .proto-side table.proto-dt td {
      border: 1px solid #cfd8dc;
      padding: 5px 7px;
      text-align: left;
    }
    .proto-side table.proto-dt th { background: #e0f2f1; }
    .proto-switcher {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--proto-bar);
      color: #fff;
      padding: 8px 10px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      z-index: 20;
      font-size: 13px;
    }
    .proto-switcher button {
      background: #fff;
      color: #111;
      border: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }
    .proto-switcher .label { min-width: 320px; text-align: center; }
    .warn { color: #b06000; }
  </style>
</head>
<body class="proto-page">
  <header class="proto-header">
    <strong>intEHRgrator</strong>
    <span>Throwaway Blockly prototypes for #85 join_list — not production</span>
  </header>
  <div class="proto-banner">
    Flip variants with the bar at the bottom or ← →. Same names, three items:
    <code>["Anna", "Bo", "Carl"]</code> → wanted Swedish reading
    <code>Anna, Bo och Carl</code>.
  </div>
  <div class="proto-main">
    <aside class="proto-side" id="side"></aside>
    <div class="proto-canvas-wrap">
      <div id="blockly"></div>
    </div>
  </div>
  <div class="proto-switcher" role="navigation" aria-label="Prototype variant">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <div class="label" id="switcher-label"></div>
    <button type="button" id="next" aria-label="Next variant">→</button>
  </div>
  <script type="module" src="./prototype-join-list.js"></script>
</body>
</html>
